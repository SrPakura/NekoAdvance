<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NekoAdvance - GBA Emulator</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#493b70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="./icon_neko.svg">
  <link rel="apple-touch-icon" href="./icon_neko.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="./css/main.css">

  <link rel="stylesheet" href="./css/modal.css">

<body>

  <div id="app">
    <!-- Main Console Workspace (Horizontal Left-to-Right / Vertical Grid) -->
    <main class="console-wrapper">
      
      <!-- 1. Left Frame: Cruceta D-Pad arriba y Select abajo -->
      <section class="left-frame control-frame">
        <div class="dpad-container">
          <div class="dpad-btn dpad-up" data-key="UP" title="Arriba">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </div>
          <div class="dpad-btn dpad-down" data-key="DOWN" title="Abajo">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="dpad-btn dpad-left" data-key="LEFT" title="Izquierda">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
          <div class="dpad-btn dpad-right" data-key="RIGHT" title="Derecha">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
        </div>

        <div class="system-btn-slot">
          <button class="capsule-btn" id="btn-select" data-key="SELECT">Select</button>
        </div>
      </section>

      <!-- 2. Center: Neko Handheld Console (Pillando todo el alto en horizontal) -->
      <section class="center-console">
        <div class="cat-svg-container">
          <img src="./UI/Neko.svg" alt="Neko Console" class="cat-svg">

          <!-- Layer over SVG for Interactive Buttons & Screen -->
          <div class="cat-interactive-layer">
            
            <!-- FPS Counter text on cat above screen -->
            <span class="cat-fps-text" id="fps-counter">fps: 60</span>
            
            <!-- Interactive 3D Vector SVG Layer -->
            <svg class="cat-interactive-svg" viewBox="0 0 1084 1032" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Normal Button Gradient -->
                <linearGradient id="neko-btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#2c2538"/>
                  <stop offset="50%" stop-color="#241e30"/>
                  <stop offset="100%" stop-color="#1b1724"/>
                </linearGradient>

                <!-- Hover Button Gradient -->
                <linearGradient id="neko-btn-hover-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#372e47"/>
                  <stop offset="50%" stop-color="#2d253b"/>
                  <stop offset="100%" stop-color="#211b2c"/>
                </linearGradient>

                <!-- Active / Pressed Button Gradient -->
                <linearGradient id="neko-btn-active-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#1c1724"/>
                  <stop offset="100%" stop-color="#120f18"/>
                </linearGradient>
              </defs>

            <!-- Screen Viewport (240x160 native, 3:2 exact) -->
            <div class="screen-viewport" id="screen-viewport">
              <canvas id="gba-canvas" width="240" height="160"></canvas>
              
              <!-- Fast Forward Badge Indicator -->
              <div class="speed-badge" id="speed-badge">⚡ 2x</div>

              <!-- Idle State Placeholder -->
              <div class="screen-placeholder" id="screen-placeholder">
                <div class="logo-text">NEKO ADVANCE</div>
                <button class="load-btn" id="load-rom-btn">Cargar ROM (.gba)</button>
                <div class="hint">Toca la nariz o presiona [START]</div>
              </div>

              <!-- In-Screen Retro GBA BIOS / System Menu -->
              <div class="retro-screen-menu" id="retro-menu">
                <!-- Retro Scanline Overlay on Screen -->
                <div class="retro-screen-scanlines"></div>

                <!-- Retro Header Tabs -->
                <header class="retro-menu-header">
                  <span class="retro-tab-trigger tab-l">&lt;L</span>
                  <nav class="retro-tabs" id="retro-tabs">
                    <button class="retro-tab active" data-tab="library">JUEGOS</button>
                    <button class="retro-tab" data-tab="states">GUARDAR</button>
                    <button class="retro-tab" data-tab="cheats">TRUCOS</button>
                    <button class="retro-tab" data-tab="settings">AJUSTES</button>
                  </nav>
                  <span class="retro-tab-trigger tab-r">R&gt;</span>
                </header>

                <!-- Retro Content Viewport -->
                <div class="retro-menu-body">
                  
                  <!-- Tab 1: JUEGOS (ROM Library) -->
                  <div class="retro-tab-panel active" id="tab-panel-library">
                    <div class="retro-list" id="retro-rom-list">
                      <!-- Rendered by JS -->
                    </div>
                  </div>

                  <!-- Tab 2: GUARDAR (Save States) -->
                  <div class="retro-tab-panel" id="tab-panel-states">
                    <div class="retro-list" id="retro-states-list">
                      <!-- Rendered by JS -->
                    </div>
                  </div>

                  <!-- Tab 3: TRUCOS (Cheats) -->
                  <div class="retro-tab-panel" id="tab-panel-cheats">
                    <div class="retro-list" id="retro-cheats-list">
                      <!-- Rendered by JS -->
                    </div>
                  </div>

                  <!-- Tab 4: AJUSTES (Settings) -->
                  <div class="retro-tab-panel" id="tab-panel-settings">
                    <div class="retro-list" id="retro-settings-list">
                      <!-- Rendered by JS -->
                    </div>
                  </div>

                </div>

                <!-- Retro Footer Controls Legend -->
                <footer class="retro-menu-footer">
                  <div class="retro-footer-guide">
                    <span><kbd class="retro-key">L/R</kbd> TAB</span>
                    <span><kbd class="retro-key">▲▼</kbd> MOVER</span>
                    <span><kbd class="retro-key">A</kbd> OK</span>
                    <span><kbd class="retro-key">B</kbd> SALIR</span>
                  </div>
                </footer>
              </div>

            </div>

          </div>
        </div>
      </section>

      <!-- 3. Right Frame: Botones A B arriba y Start abajo -->
      <section class="right-frame control-frame">
        <div class="action-buttons">
          <button class="action-btn btn-a" data-key="A" title="Botón A">A</button>
          <button class="action-btn btn-b" data-key="B" title="Botón B">B</button>
        </div>

        <div class="system-btn-slot">
          <button class="capsule-btn" id="btn-start" data-key="START">Start</button>
        </div>
      </section>

    </main>

    <!-- Hidden ROM File Input -->
    <input type="file" id="rom-file-input" accept=".gba,.bin,.agb,.zip" style="display: none;">

    <!-- Drag & Drop Fullscreen Overlay -->
    <div class="drop-overlay" id="drop-overlay">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <h2>¡Suelta tu ROM aquí!</h2>
      <p>Formatos soportados: .gba, .bin, .agb, .zip</p>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

  </div>

  <!-- Core GBA Emulation Engine (gbajs HLE Engine) -->
  <script src="./js/core/gbajs/util.js"></script>
  <script src="./js/core/gbajs/arm.js"></script>
  <script src="./js/core/gbajs/thumb.js"></script>
  <script src="./js/core/gbajs/core.js"></script>
  <script src="./js/core/gbajs/video/software.js"></script>
  <script src="./js/core/gbajs/video.js"></script>
  <script src="./js/core/gbajs/mmu.js"></script>
  <script src="./js/core/gbajs/savedata.js"></script>
  <script src="./js/core/gbajs/gpio.js"></script>
  <script src="./js/core/gbajs/io.js"></script>
  <script src="./js/core/gbajs/audio.js"></script>
  <script src="./js/core/gbajs/irq.js"></script>
  <script src="./js/core/gbajs/keypad.js"></script>
  <script src="./js/core/gbajs/sio.js"></script>
  <script src="./js/core/gbajs/gba.js"></script>

  <!-- Main JavaScript App -->
  <script type="module" src="./js/app.js"></script>
</body>
