<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c2f5e"/>
      <stop offset="100%" stop-color="#1f1833"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23202e"/>
      <stop offset="100%" stop-color="#121017"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a78bfa" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Cat Console Silhouette -->
  <g filter="url(#glow)">
    <!-- Ears -->
    <path d="M100 180 L140 70 Q160 50 190 85 L230 150 Z" fill="#2d2838" stroke="#4e4663" stroke-width="4"/>
    <path d="M412 180 L372 70 Q352 50 322 85 L282 150 Z" fill="#2d2838" stroke="#4e4663" stroke-width="4"/>
    
    <!-- Ear Inner / Triggers -->
    <path d="M120 160 L148 95 Q160 85 175 105 L195 145 Z" fill="#1c1824" stroke="#a78bfa" stroke-width="3"/>
    <text x="150" y="135" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">L</text>
    
    <path d="M392 160 L364 95 Q352 85 337 105 L317 145 Z" fill="#1c1824" stroke="#a78bfa" stroke-width="3"/>
    <text x="362" y="135" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">R</text>

    <!-- Head Body -->
    <rect x="80" y="130" width="352" height="310" rx="60" fill="#2d2838" stroke="#4e4663" stroke-width="4"/>

    <!-- Screen Bezel -->
    <rect x="120" y="165" width="272" height="180" rx="16" fill="url(#screenGrad)" stroke="#51407e" stroke-width="5"/>

    <!-- Screen Glass Pixel Grid / Shine -->
    <rect x="135" y="180" width="242" height="150" rx="8" fill="#493b70" fill-opacity="0.3"/>
    <text x="256" y="265" fill="#e0e7ff" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="4">NEKO GBA</text>

    <!-- Cat Nose (Menu Button) -->
    <path d="M242 385 Q256 375 270 385 Q275 398 256 405 Q237 398 242 385 Z" fill="#a78bfa"/>
    <path d="M256 405 Q245 420 230 415 M256 405 Q267 420 282 415" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="140" y1="385" x2="190" y2="395" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="410" x2="190" y2="410" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="372" y1="385" x2="322" y2="395" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="377" y1="410" x2="322" y2="410" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
